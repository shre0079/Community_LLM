<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Distributed OLMoE</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;display:flex;flex-direction:column;height:100vh}
    header{padding:16px 24px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:1.1rem;font-weight:600;color:#7c3aed}
    #status-bar{display:flex;gap:12px;font-size:0.75rem}
    .badge{padding:3px 10px;border-radius:12px;font-weight:500}
    .badge.ready{background:#14532d;color:#4ade80}
    .badge.waiting{background:#1e1b4b;color:#818cf8}
    #workers-panel{display:flex;gap:8px;padding:12px 24px;background:#0a0d14;border-bottom:1px solid #1e293b;flex-wrap:wrap}
    .worker-card{background:#1e293b;border-radius:8px;padding:8px 12px;font-size:0.72rem;min-width:160px}
    .worker-card .name{font-weight:600;color:#94a3b8;margin-bottom:2px}
    .worker-card .layers{color:#7c3aed}
    .worker-card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
    .dot.active{background:#4ade80}
    .dot.loading{background:#fbbf24}
    .dot.dead{background:#ef4444}
    #chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
    .msg{max-width:72%;padding:12px 16px;border-radius:12px;line-height:1.6;font-size:0.9rem}
    .msg.user{background:#7c3aed;align-self:flex-end;border-radius:12px 12px 2px 12px}
    .msg.assistant{background:#1e293b;align-self:flex-start;border-radius:2px 12px 12px 12px;white-space:pre-wrap}
    .msg.thinking{opacity:0.6;font-style:italic}
    #input-row{display:flex;gap:10px;padding:16px 24px;border-top:1px solid #1e293b;background:#0f1117}
    #prompt{flex:1;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:12px 16px;font-size:0.9rem;resize:none;height:52px;font-family:inherit}
    #prompt:focus{outline:none;border-color:#7c3aed}
    #send{background:#7c3aed;color:white;border:none;border-radius:8px;padding:0 24px;font-size:0.9rem;font-weight:600;cursor:pointer;height:52px}
    #send:disabled{opacity:0.5;cursor:default}
    .meta{font-size:0.68rem;color:#475569;margin-top:4px;align-self:flex-start}
  </style>
</head>
<body>
  <header>
    <h1>⬡ Distributed OLMoE</h1>
    <div id="status-bar">
      <span id="pipeline-badge" class="badge waiting">Pipeline: checking…</span>
    </div>
  </header>
  <div id="workers-panel"></div>
  <div id="chat"></div>
  <div id="input-row">
    <textarea id="prompt" placeholder="Ask anything…" rows="1"></textarea>
    <button id="send" disabled>Send</button>
  </div>

<script>
const chat = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const badge = document.getElementById('pipeline-badge');
const workersPanel = document.getElementById('workers-panel');

function addMessage(text, role, meta = '') {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    chat.appendChild(m);
  }
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function pollStatus() {
  try {
    const res = await fetch('/workers');
    const data = await res.json();
    
    badge.textContent = data.pipeline_ready ? 'Pipeline: Ready ✓' : 'Pipeline: Waiting…';
    badge.className = `badge ${data.pipeline_ready ? 'ready' : 'waiting'}`;
    sendBtn.disabled = !data.pipeline_ready;

    workersPanel.innerHTML = data.workers.map(w => `
      <div class="worker-card">
        <div class="name"><span class="dot ${w.status}"></span>${w.hostname}</div>
        <div class="layers">Layers ${w.layers}</div>
        <div style="color:#64748b;margin-top:2px">${w.gpu} · ${w.status}</div>
      </div>
    `).join('');
  } catch {}
}

async function sendMessage() {
  const text = promptEl.value.trim();
  if (!text) return;
  promptEl.value = '';
  sendBtn.disabled = true;

  addMessage(text, 'user');
  const thinking = addMessage('Thinking…', 'assistant thinking');
  const t0 = Date.now();

  try {
    const res = await fetch('/infer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: text, max_new_tokens: 200, temperature: 0.8})
    });
    const data = await res.json();
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    thinking.remove();
    addMessage(data.response, 'assistant', `${elapsed}s · VRAM: ${(data.vram_used_gb||0).toFixed(2)} GB`);
  } catch (e) {
    thinking.textContent = `Error: ${e.message}`;
    thinking.classList.remove('thinking');
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

pollStatus();
setInterval(pollStatus, 5000);
</script>
</body>
</html>
